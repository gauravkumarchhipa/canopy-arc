<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — SAHAI</title>
    <meta
      name="description"
      content="You're offline. SAHAI will reconnect automatically when you're back online."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        color: #f4f5fb;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }
      .wrap {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.5rem;
        overflow: hidden;
      }
      .blob {
        position: absolute;
        width: 28rem;
        height: 28rem;
        border-radius: 9999px;
        filter: blur(80px);
        opacity: 0.45;
        pointer-events: none;
      }
      .blob.a {
        top: -8rem;
        left: -10rem;
        background: radial-gradient(
          circle,
          #6ee7ff 0%,
          rgba(110, 231, 255, 0) 70%
        );
      }
      .blob.b {
        bottom: -8rem;
        right: -10rem;
        background: radial-gradient(
          circle,
          #ff7eb6 0%,
          rgba(255, 126, 182, 0) 70%
        );
      }
      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.3;
        background-image:
          linear-gradient(
            to right,
            rgba(255, 255, 255, 0.04) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.04) 1px,
            transparent 1px
          );
        background-size: 64px 64px;
        mask-image: linear-gradient(to bottom, #000 60%, transparent 100%);
      }
      .content {
        position: relative;
        max-width: 36rem;
      }
      .eyebrow {
        font-size: 0.7rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #8b90a8;
        margin: 0 0 1.5rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .dot {
        position: relative;
        display: inline-flex;
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 9999px;
        background: #f59e0b;
      }
      .dot::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: #f59e0b;
        opacity: 0.5;
        animation: ping 1.6s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      h1 {
        font-family: "Instrument Serif", "Source Serif Pro", Georgia, serif;
        font-weight: 400;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.01em;
        margin: 0 0 1.5rem;
      }
      .grad {
        background: linear-gradient(135deg, #6ee7ff 0%, #b388ff 50%, #ff7eb6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p.lead {
        font-size: 1rem;
        line-height: 1.6;
        color: #8b90a8;
        margin: 0 auto 2.5rem;
        max-width: 28rem;
      }
      .row {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
        justify-content: center;
      }
      @media (min-width: 480px) {
        .row {
          flex-direction: row;
        }
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.85rem 1.6rem;
        border-radius: 9999px;
        font-weight: 500;
        text-decoration: none;
        font-size: 0.95rem;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      a.primary {
        background: linear-gradient(135deg, #6ee7ff 0%, #b388ff 50%, #ff7eb6 100%);
        color: #0a0d18;
        box-shadow: 0 12px 40px -12px rgba(110, 231, 255, 0.45);
      }
      a.primary:hover {
        transform: translateY(-2px);
      }
      a.ghost {
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #f4f5fb;
      }
      a.ghost:hover {
        border-color: rgba(255, 255, 255, 0.5);
      }
      .pages {
        margin-top: 3rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
      }
      .pages a {
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8b90a8;
        text-decoration: none;
        padding: 0.4rem 0.85rem;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: border-color 0.2s, color 0.2s;
      }
      .pages a:hover {
        color: #f4f5fb;
        border-color: rgba(255, 255, 255, 0.3);
      }
      @keyframes ping {
        75%,
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="blob a"></div>
      <div class="blob b"></div>
      <div class="grid"></div>

      <div class="content">
        <p class="eyebrow"><span class="dot"></span> You're offline</p>
        <h1>
          Care that listens
          <span class="grad">— even without signal.</span>
        </h1>
        <p class="lead">
          The internet dropped, but SAHAI is still here. Most pages are saved on
          your device. We'll reconnect automatically when you're back online.
        </p>

        <div class="row">
          <a class="btn primary" href="/">Back to home</a>
          <a class="btn ghost" href="javascript:location.reload()">Retry</a>
        </div>

        <div class="pages">
          <a href="/">Home</a>
          <a href="/about">About</a>
          <a href="/features">Features</a>
          <a href="/pricing">Pricing</a>
          <a href="/how-it-works">How it works</a>
          <a href="/faq">FAQ</a>
          <a href="/team">Team</a>
          <a href="/for-doctors">Doctors</a>
          <a href="/contact">Contact</a>
        </div>
      </div>
    </div>

    <script>
      // Auto-reload when the network comes back
      window.addEventListener("online", () => {
        location.reload();
      });
    </script>
  </body>
</html>
